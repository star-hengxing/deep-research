[project]
name = "deep-research"
version = "0.2.0"
description = "Enterprise-grade research CLI with multi-source synthesis, citation tracking, and PDF generation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "rich>=13,<14",
  "typer>=0.12,<1",
]

[project.scripts]
deep-research = "deep_research.app:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # pyflakes
  "I",  # isort
  "N",  # naming
  "UP",  # pyupgrade
  "B",  # flake8-bugbear
  "SIM",  # flake8-simplify
]
ignore = [
  "B008",  # typer requires function calls in argument defaults
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.setuptools.packages.find]
where = ["src"]
